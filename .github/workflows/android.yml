name: Android Build (all)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Haxe kütüphaneleri
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib git lime https://github.com/openfl/lime
          haxelib install hxcpp-debug-server || true
          # buraya projenin kendi kütüphanelerini ekle:
          # haxelib install flixel
          # haxelib git linc_luajit https://github.com/...

      - name: Lime ve Android ayarı
        run: |
          cd ~/haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml
          haxelib run lime setup -y
          NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $NDK
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime rebuild android

      - name: APK derle
        run: haxelib run lime build android -release

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-Engine-apk
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
