name: Android Build (arm64)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Haxelib önbelleği
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-android-arm64-v1

      - name: Haxe kütüphaneleri
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib install format
          haxelib install hxp
          haxelib git lime https://github.com/kittycathy233/lime
          haxelib install openfl
          haxelib install flixel 5.8.0
          haxelib install flixel-addons 3.3.2
          haxelib install flixel-ui
          haxelib install tjson 1.4.0
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib git hscript-iris https://github.com/crowplexus/hscript-iris
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate
          haxelib install hxcpp-debug-server || true

      - name: Lime ve Android ayarı
        run: |
          cd ~/haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml
          haxelib run lime setup -y
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" >/dev/null
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $NDK
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
          sed -i 's|<flag value="-fpic"/>|<flag value="-fpic"/>\n  <flag value="-fcommon"/>|' ~/haxelib/hxcpp/git/toolchain/android-toolchain-clang.xml
          haxelib run lime rebuild android -arm64

      - name: APK derle
        run: haxelib run lime build android -arm64 -release -DHXCPP_ARM64

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-Engine-apk
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find export -name "*.apk" | head -1)
          gh release delete arm64-latest --cleanup-tag -y || true
          gh release create arm64-latest "$APK" --title "arm64 build" --notes "arm64 only"
